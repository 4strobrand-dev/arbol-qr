<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Generador de código QR que es un árbol en voxeles. Visto desde arriba, la copa y el pasto forman el QR.">
<title>Árbol QR</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: escena cuadrada centrada, panel de controles debajo; todo plano sobre crema */
:root{
  --bg:#f2eee6; --surface:#fbf8f2; --line:#ddd5c7; --field:#cfc6b6;
  --ink:#3a3128; --muted:#8b8072; --sel:#e8dfd1; --accent:#b8642a;
  --ui:'Figtree',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);transition:background-color .9s ease}
.app{min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#stage{width:min(100%,560px);max-width:100%;aspect-ratio:1;position:relative;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#stage canvas{display:block;width:100%!important;height:100%!important}
.panel{width:min(100%,520px);display:flex;flex-direction:column;align-items:center;gap:10px}
.chip{font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 13px;letter-spacing:.01em}
.row{display:flex;gap:8px;width:100%}
.url{flex:1;min-width:0;height:46px;box-sizing:border-box;border:1px solid var(--field);border-radius:11px;background:var(--surface);
  padding:0 13px;font:400 15px var(--ui);color:var(--ink)}
.url:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.icon-btn{flex:none;width:46px;height:46px;border:0;border-radius:11px;background:var(--accent);color:#fff;display:grid;place-items:center;cursor:pointer;transition:background-color .9s ease}
.exports{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;width:100%}
.exp{height:44px;border:0;border-radius:11px;background:var(--accent);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;font:600 14px var(--ui);transition:background-color .9s ease}
.exp:disabled{opacity:.6;cursor:progress}
.exp:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.icon-btn:focus-visible,.season:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.err{margin:0;font-size:12.5px;color:#a3402a;align-self:flex-start}
.seasons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) 42px;gap:6px;width:100%}
.season{height:40px;border:0;border-radius:10px;background:var(--surface);color:var(--muted);cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;font:500 13px var(--ui);padding:0 4px;min-width:0}
.season span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.season[aria-pressed="true"]{background:var(--sel);color:var(--ink)}
.season svg{flex:none}
@media (max-width:440px){.season svg.ico{display:none}.season{font-size:11.5px;padding:0 2px}.seasons{grid-template-columns:repeat(4,minmax(0,1fr)) 38px;gap:5px}}
.overlay{position:fixed;inset:0;background:rgba(40,33,26,.55);display:grid;place-items:center;z-index:20;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{background:var(--surface);border-radius:16px;padding:16px;width:min(100%,420px);box-sizing:border-box;display:flex;flex-direction:column;gap:12px;align-items:center}
.sheet canvas{width:100%;height:auto;border-radius:10px;display:block}
.sheet p{margin:0;font-size:13px;color:var(--muted);text-align:center}
.sheet button{height:42px;width:100%;border:0;border-radius:10px;background:var(--sel);color:var(--ink);font:600 14px var(--ui);cursor:pointer}
</style>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
.foot{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;font-size:12.5px;color:var(--muted)}
.foot a{color:var(--ink);text-underline-offset:3px}
</style>
</head>
<body>


<div class="app">
  <div id="stage" role="button" aria-label="Cambiar entre árbol y código QR" tabindex="0"></div>
  <div class="panel">
    <div class="chip" id="chip">Toca el árbol para ver el código QR</div>
    <div class="row">
      <input class="url" id="url" type="url" inputmode="url" autocomplete="off" spellcheck="false" value="https://astrobrand.org" aria-label="Enlace del código QR">
    </div>
    <p class="err" id="err" hidden>Ese texto es demasiado largo para un código QR. Prueba con un enlace más corto.</p>
    <div class="seasons" role="group" aria-label="Estación">
      <button class="season" data-s="spring" aria-pressed="false"><svg class="ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="2.5"/><circle cx="12" cy="6.5" r="3"/><circle cx="12" cy="17.5" r="3"/><circle cx="6.5" cy="12" r="3"/><circle cx="17.5" cy="12" r="3"/></svg><span>Primavera</span></button>
      <button class="season" data-s="summer" aria-pressed="false"><svg class="ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span>Verano</span></button>
      <button class="season" data-s="autumn" aria-pressed="true"><svg class="ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M17.5 14a4.5 4.5 0 0 0-1-8.9A6 6 0 0 0 5 8a4 4 0 0 0 .5 6"/><path d="M8 17v3M12 16v5M16 17v3"/></svg><span>Otoño</span></button>
      <button class="season" data-s="winter" aria-pressed="false"><svg class="ico" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 2v20M4 7l16 10M4 17 20 7M9 4l3 2 3-2M9 20l3-2 3 2"/></svg><span>Invierno</span></button>
      <button class="season" id="mute" aria-pressed="false" aria-label="Activar sonido" title="Sonido">
        <svg id="ico-off" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg>
        <svg id="ico-on" hidden width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      </button>
    </div>
    <div class="exports" role="group" aria-label="Exportar">
      <button class="exp" id="vid" aria-label="Exportar video vertical"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="13" height="14" rx="2"/><path d="m16 10 5-3v10l-5-3"/></svg><span>Video</span></button>
      <button class="exp" id="gif" aria-label="Exportar GIF animado"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M10 9.5v5l4-2.5z"/></svg><span>GIF</span></button>
      <button class="exp" id="save" aria-label="Guardar imagen PNG"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg><span>Imagen</span></button>
    </div>
    <nav class="foot" aria-label="Descargas">
      <a href="index.html" download="arbol-qr.html">Descargar el archivo HTML</a>
      <a href="https://github.com/4strobrand-dev/arbol-qr">Ver en GitHub</a>
    </nav>
  </div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="sheet">
    <canvas id="shot" aria-label="Vista previa de la imagen"></canvas>
    <p id="msg"></p>
    <button id="close">Cerrar</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>var exports = {};</script>
<script src="https://cdn.jsdelivr.net/npm/gifenc@1.0.3/dist/gifenc.js"></script>
<script>window.GIFENC = exports;</script>
<script>
(() => {
const V3 = THREE.Vector3;
const $ = s => document.querySelector(s);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const ease = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x+2, 3)/2;
const clamp01 = x => Math.max(0, Math.min(1, x));
const hash = (a,b,s) => { const x = Math.sin(a*127.1 + b*311.7 + s*74.7)*43758.5453; return x - Math.floor(x); };
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed>>>15, 1|seed); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14)>>>0)/4294967296; }; }
const rr = (a,b) => a + Math.random()*(b-a);

/* ---------- Estaciones ----------
   Desde arriba, las hojas de la copa y el pasto forman los módulos oscuros del QR,
   así que todas las paletas de hojas y pasto son lo bastante oscuras para escanear. */
const CREAM = ['#f1eee9','#ece8e2','#f3f0ea','#e9e5de'];
const SEASONS = {
  spring:{ bg:'#f2eee6', accent:'#c4505e', light:CREAM,
    leaves:['#e05563','#e86a74','#d4475a','#e3707a','#c93f52'],
    grass:['#4c8a3a','#5f9e45','#3f7a32','#6aa64c'], grassH:1,
    fall:{ every:.14, max:120, colors:['#f2808a','#f5a3aa','#ee6b74','#f8c0c4'], scale:.5, speed:.8 },
    rain:0, snow:0, motes:.7, moteColor:'#f6c4cc', audio:{ wind:.10, rain:0, birds:true } },
  summer:{ bg:'#f2eee6', accent:'#4f8a3a', light:CREAM,
    leaves:['#447f33','#55933f','#376f2e','#64a047','#2f632b'],
    grass:['#55701c','#647f22','#4a6318','#6c8828'], grassH:1.15,
    fall:{ every:.8, max:24, colors:['#62a347','#8fab38','#b6b04a'], scale:.6, speed:.7 },
    rain:0, snow:0, motes:1, moteColor:'#e9b93c', audio:{ wind:.07, rain:0, birds:true } },
  autumn:{ bg:'#f2eee6', accent:'#b8642a', light:CREAM,
    leaves:['#d4602a','#e07a2c','#c24e1f','#dd8a2e','#b5421b'],
    grass:['#9c741a','#a88020','#8c6816','#7f6014'], grassH:1,
    fall:{ every:.07, max:170, colors:['#ea8a30','#f0a03a','#e0702a','#f5b942','#cf5a22'], scale:.6, speed:1 },
    rain:1, snow:0, motes:0, moteColor:'#ffffff', audio:{ wind:.05, rain:.22, birds:false } },
  winter:{ bg:'#eceff1', accent:'#4d7fb5', light:['#fafbfc','#f1f4f7','#f6f8fa','#eef1f4'],
    leaves:['#5d93c9','#6fa4d8','#4d82ba','#80b1dd','#4677ad'],
    grass:['#3f5f4f','#4d6b58','#355446','#577462'], grassH:.75,
    fall:{ every:99, max:0, colors:['#ffffff'], scale:.5, speed:1 },
    rain:0, snow:1, motes:0, moteColor:'#ffffff', audio:{ wind:.11, rain:0, birds:false } },
};
let season = 'autumn';

/* ---------- Render base ---------- */
const stage = $('#stage');
const renderer = new THREE.WebGLRenderer({ antialias:true, preserveDrawingBuffer:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const clearCol = new THREE.Color(SEASONS[season].bg);
renderer.setClearColor(clearCol, 1);
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const cam = new THREE.OrthographicCamera(-1,1,1,-1,.1,3000);
scene.add(new THREE.HemisphereLight(0xffffff, 0xd6ccbc, .55));
const sun = new THREE.DirectionalLight(0xfff4e6, .55);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0006; sun.shadow.normalBias = .02;
scene.add(sun, sun.target);

const uTime = { value:0 };
const uGrassH = { value:1 };
const uBranch = { value:1 };
const uFlutter = { value:1 };

function pointTex(edge){
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), gr = g.createRadialGradient(32,32,0,32,32,30);
  gr.addColorStop(0,'rgba(255,255,255,1)');
  if (edge){ gr.addColorStop(.55,'rgba(255,255,255,1)'); gr.addColorStop(.75,'rgba(150,165,185,.85)'); gr.addColorStop(1,'rgba(150,165,185,0)'); }
  else { gr.addColorStop(.4,'rgba(255,255,255,.9)'); gr.addColorStop(1,'rgba(255,255,255,0)'); }
  g.fillStyle = gr; g.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(c);
}
const dotTex = pointTex(true), softTex = pointTex(false);

function leafGeometry(){
  const s = new THREE.Shape();
  for (let i = 0; i < 10; i++){
    const r = i % 2 ? .34 : .62, a = i/10*Math.PI*2 + Math.PI/2;
    const x = Math.cos(a)*r, y = Math.sin(a)*r;
    i ? s.lineTo(x,y) : s.moveTo(x,y);
  }
  return new THREE.ShapeGeometry(s);
}

/* ---------- Mundo ---------- */
const Q = 3;
let N, S, half, world, tiles, cells, heights, grass, bladeK, branchMesh, leaves, leafK, leafPos, treeGroup;
let fallMesh, falls = [], rain, snow, motes;
const tmpM = new THREE.Matrix4(), tmpQ = new THREE.Quaternion(), tmpE = new THREE.Euler(), tmpS = new V3(), tmpP = new V3();

function disposeWorld(){
  if (!world) return;
  scene.remove(world);
  world.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m.dispose());
  });
}

function inFinder(r, c){
  const f = 8;
  return (r < f && c < f) || (r < f && c >= N - f) || (r >= N - f && c < f);
}

function buildWorld(qr){
  disposeWorld();
  N = qr.n; S = N + 2*Q; half = S/2;
  world = new THREE.Group(); scene.add(world);
  const k = S/35;

  // La copa es una elipse vista desde arriba: radio en módulos y altura en mundo
  const Rc = N*.44, Yc = S*.44, Ry = S*.17;

  const slab = new THREE.Mesh(new THREE.BoxGeometry(S, 1.6, S), new THREE.MeshLambertMaterial({ color:0xe2ddd5 }));
  slab.position.y = -.8; slab.receiveShadow = true; world.add(slab);

  // Baldosas: una por módulo, más la zona de silencio
  const tg = new THREE.BoxGeometry(1,1,1); tg.translate(0,.5,0);
  tiles = new THREE.InstancedMesh(tg, new THREE.MeshLambertMaterial({ color:0xffffff }), S*S);
  tiles.receiveShadow = true;
  cells = []; heights = new Float32Array(S*S);
  for (let r = 0; r < S; r++) for (let c = 0; c < S; c++){
    const i = r*S + c, qr_ = r - Q, qc = c - Q;
    const inside = qr_ >= 0 && qr_ < N && qc >= 0 && qc < N;
    const dark = inside && qr.m[qr_*N + qc];
    const x = c - half + .5, z = r - half + .5;
    const d = Math.hypot(qr_ - (N-1)/2, qc - (N-1)/2);
    let kind = 'light';
    if (dark) kind = (d < Rc && !inFinder(qr_, qc)) ? 'leaf' : 'grass';
    const h = dark ? .62 : .5;
    heights[i] = h;
    tmpM.makeScale(1, h, 1); tmpM.setPosition(x, 0, z);
    tiles.setMatrixAt(i, tmpM);
    tiles.setColorAt(i, clearCol);
    cells.push({ kind, x, z, d, k:hash(r,c,1) });
  }
  world.add(tiles);

  // Pasto en voxeles: cada módulo de pasto es una rejilla de 3×3 columnas de cubos con alturas escalonadas
  const blades = [], V = 1/3;
  cells.forEach((cl, i) => {
    if (cl.kind !== 'grass') return;
    for (let a = 0; a < 3; a++) for (let b = 0; b < 3; b++){
      if (Math.random() < .08) continue;
      const steps = 1 + (Math.random()*4 | 0);
      blades.push([cl.x + (a - 1)*V, cl.z + (b - 1)*V, heights[i], steps*V*.9*k]);
    }
  });
  const bg = new THREE.BoxGeometry(1, 1, 1); bg.translate(0,.5,0);
  const gm = new THREE.MeshLambertMaterial({ color:0xffffff });
  gm.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, { uTime, uH:uGrassH, uF:uFlutter });
    sh.vertexShader = 'uniform float uTime; uniform float uH; uniform float uF;\n' + sh.vertexShader.replace('#include <begin_vertex>',
      `#include <begin_vertex>
      float hh = position.y;
      vec3 ip = instanceMatrix[3].xyz;
      transformed.y *= uH;
      transformed.x += sin(uTime*1.5 + ip.x*.45 + ip.z*.3) * .12 * hh * uF;
      transformed.z += cos(uTime*1.2 + ip.x*.25 - ip.z*.4) * .07 * hh * uF;`);
  };
  grass = new THREE.InstancedMesh(bg, gm, Math.max(1, blades.length));
  grass.receiveShadow = true;
  bladeK = new Float32Array(blades.length);
  blades.forEach(([x,z,y,h], i) => {
    tmpM.makeScale(V*.92, h, V*.92); tmpM.setPosition(x, y, z);
    grass.setMatrixAt(i, tmpM);
    grass.setColorAt(i, clearCol); bladeK[i] = Math.random();
  });
  grass.count = blades.length;
  world.add(grass);

  // Tronco y ramas: van del suelo hasta la base de la copa
  treeGroup = new THREE.Group(); world.add(treeGroup);
  const R = rng(11), segs = [];
  function growBranch(start, dir, len, rad, depth){
    const end = start.clone().addScaledVector(dir, len);
    segs.push({ start, dir:dir.clone(), len, rad });
    if (depth === 0) return;
    const kids = depth >= 3 ? 2 : (R() < .4 ? 3 : 2);
    for (let j = 0; j < kids; j++){
      const axis = new V3(R()-.5, 0, R()-.5).cross(dir).normalize();
      const nd = dir.clone().applyAxisAngle(axis, .35 + R()*.5);
      nd.y += .25; nd.normalize();
      growBranch(end, nd, len*(.68 + R()*.12), rad*.66, depth-1);
    }
  }
  growBranch(new V3(0,.5,0), new V3(0,1,0), Yc*.36, S*.016, 4);
  const cg = new THREE.CylinderGeometry(.68, 1, 1, 6, 1); cg.translate(0,.5,0);
  const bm = new THREE.MeshLambertMaterial({ color:0x6e4b36 });
  bm.onBeforeCompile = sh => {
    sh.uniforms.uB = uBranch;
    sh.vertexShader = 'uniform float uB;\n' + sh.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\n transformed.xz *= uB;');
  };
  branchMesh = new THREE.InstancedMesh(cg, bm, segs.length);
  branchMesh.castShadow = true;
  const up = new V3(0,1,0);
  segs.forEach((s, i) => {
    tmpQ.setFromUnitVectors(up, s.dir); tmpS.set(s.rad, s.len*1.02, s.rad);
    tmpM.compose(s.start, tmpQ, tmpS); branchMesh.setMatrixAt(i, tmpM);
  });
  treeGroup.add(branchMesh);

  // Copa: cada módulo oscuro dentro del círculo es una columna de hojas
  // que no se sale de su celda, para que desde arriba se lea el módulo exacto.
  const leafCells = cells.filter(c => c.kind === 'leaf');
  const items = [];
  leafCells.forEach(cl => {
    const t = Math.sqrt(Math.max(0, 1 - (cl.d/Rc)**2));
    const top = Yc + Ry*t + (hash(cl.x, cl.z, 4) - .5)*1.6*k;
    const bottom = Yc - Ry*t*.85 + (hash(cl.x, cl.z, 5) - .5)*1.2*k;
    const n = Math.max(5, Math.round((top - bottom)*1.7));
    for (let j = 0; j < n; j++){
      const cap = j < 3;
      const y = cap ? top - j*.12 : bottom + Math.random()*(top - bottom);
      items.push({ x:cl.x + rr(-.08,.08), y, z:cl.z + rr(-.08,.08), cap });
    }
  });
  const lm = new THREE.MeshLambertMaterial({ color:0xffffff, side:THREE.DoubleSide });
  lm.onBeforeCompile = sh => {
    Object.assign(sh.uniforms, { uTime, uF:uFlutter });
    sh.vertexShader = 'uniform float uTime; uniform float uF;\n' + sh.vertexShader.replace('#include <begin_vertex>',
      `#include <begin_vertex>
      vec3 ip = instanceMatrix[3].xyz;
      transformed += vec3(sin(uTime*2.3 + ip.y*1.7 + ip.x), cos(uTime*1.9 + ip.z*1.3), sin(uTime*2.1 + ip.x*1.1)) * .06 * uF;`);
  };
  leaves = new THREE.InstancedMesh(leafGeometry(), lm, Math.max(1, items.length));
  leaves.castShadow = true;
  leafK = new Float32Array(items.length); leafPos = [];
  items.forEach((it, i) => {
    const tilt = it.cap ? .2 : .55;
    tmpE.set(-Math.PI/2 + rr(-tilt,tilt), rr(-tilt,tilt), Math.random()*Math.PI*2, 'YXZ');
    tmpQ.setFromEuler(tmpE);
    const sc = it.cap ? .64 : rr(.5,.66); tmpS.set(sc, sc, sc);
    tmpP.set(it.x, it.y, it.z);
    tmpM.compose(tmpP, tmpQ, tmpS); leaves.setMatrixAt(i, tmpM);
    leaves.setColorAt(i, clearCol);
    leafK[i] = Math.random(); leafPos.push(tmpP.clone());
  });
  leaves.count = items.length;
  treeGroup.add(leaves);

  // Hojas que caen
  const MAXF = 180;
  fallMesh = new THREE.InstancedMesh(leafGeometry(), new THREE.MeshLambertMaterial({ color:0xffffff, side:THREE.DoubleSide }), MAXF);
  falls = [];
  tmpM.makeScale(0,0,0);
  for (let i = 0; i < MAXF; i++){ fallMesh.setMatrixAt(i, tmpM); fallMesh.setColorAt(i, clearCol); falls.push({ alive:false }); }
  world.add(fallMesh);

  // Lluvia
  const RAIN = 260, rp = new Float32Array(RAIN*6), rd = [];
  for (let i = 0; i < RAIN; i++) rd.push({ x:rr(-half,half), y:rr(0,S*.8), z:rr(-half,half), v:rr(24,32) });
  const rgeo = new THREE.BufferGeometry(); rgeo.setAttribute('position', new THREE.BufferAttribute(rp, 3));
  rain = { obj:new THREE.LineSegments(rgeo, new THREE.LineBasicMaterial({ color:0x9b958c, transparent:true, opacity:0, depthWrite:false })), d:rd, level:0 };
  rain.obj.frustumCulled = false; world.add(rain.obj);

  // Nieve
  const SN = 900, sp = new Float32Array(SN*3), sd = [];
  for (let i = 0; i < SN; i++) sd.push({ x:rr(-half,half), y:rr(0,S*.8), z:rr(-half,half), ph:Math.random() });
  const sgeo = new THREE.BufferGeometry(); sgeo.setAttribute('position', new THREE.BufferAttribute(sp, 3));
  snow = { obj:new THREE.Points(sgeo, new THREE.PointsMaterial({ size:4.5, map:dotTex, transparent:true, opacity:0, depthWrite:false })), d:sd, level:0 };
  snow.obj.frustumCulled = false; world.add(snow.obj);

  // Polen y luciérnagas
  const MO = 160, mp = new Float32Array(MO*3), md = [];
  for (let i = 0; i < MO; i++) md.push({ x:rr(-S*.36,S*.36), y:rr(1,S*.65), z:rr(-S*.36,S*.36), ph:Math.random()*6.28 });
  const mgeo = new THREE.BufferGeometry(); mgeo.setAttribute('position', new THREE.BufferAttribute(mp, 3));
  motes = { obj:new THREE.Points(mgeo, new THREE.PointsMaterial({ size:4, map:softTex, color:0xffffff, transparent:true, opacity:0, depthWrite:false })), d:md, level:0 };
  motes.obj.frustumCulled = false; world.add(motes.obj);

  sun.position.set(-S*.6, S*1.2, S*.35);
  const sc = sun.shadow.camera;
  sc.left = -S*.8; sc.right = S*.8; sc.top = S*.8; sc.bottom = -S*.8; sc.near = 1; sc.far = S*4;
  sc.updateProjectionMatrix();

  setSeason(season, true);
  resize();
}

/* ---------- Transición de estación ---------- */
let blend = 1, fades = [], hFrom = 1, hTo = 1, bgFrom = new THREE.Color(), bgTo = new THREE.Color();
function seasonColors(mesh, n, pick){
  const to = new Float32Array(n*3), c = new THREE.Color();
  for (let i = 0; i < n; i++){ pick(i, c); to[i*3] = c.r; to[i*3+1] = c.g; to[i*3+2] = c.b; }
  return { attr:mesh.instanceColor, from:Float32Array.from(mesh.instanceColor.array), to };
}
function setSeason(key, instant){
  season = key;
  const P = SEASONS[key], pick = (arr, v) => arr[Math.floor(v*arr.length) % arr.length];
  fades = [
    seasonColors(tiles, cells.length, (i, c) => {
      const cl = cells[i];
      if (cl.kind === 'leaf') c.set(pick(P.leaves, cl.k)).multiplyScalar(.82);
      else if (cl.kind === 'grass') c.set(pick(P.grass, cl.k)).multiplyScalar(.85);
      else c.set(pick(P.light, cl.k));
    }),
    seasonColors(grass, bladeK.length, (i, c) => c.set(pick(P.grass, bladeK[i]))),
    seasonColors(leaves, leafK.length, (i, c) => c.set(pick(P.leaves, leafK[i]))),
  ];
  hFrom = uGrassH.value; hTo = P.grassH;
  bgFrom.copy(clearCol); bgTo.set(P.bg);
  motes.obj.material.color.set(P.moteColor);
  document.documentElement.style.setProperty('--accent', P.accent);
  document.documentElement.style.setProperty('--bg', P.bg);
  document.querySelectorAll('.season[data-s]').forEach(b => b.setAttribute('aria-pressed', b.dataset.s === key));
  blend = instant ? 1 : 0;
  applyBlend(blend);
  audioSeason();
}
function applyBlend(t){
  const e = ease(t);
  fades.forEach(f => {
    const a = f.attr.array;
    for (let j = 0; j < a.length; j++) a[j] = f.from[j] + (f.to[j] - f.from[j])*e;
    f.attr.needsUpdate = true;
  });
  uGrassH.value = hFrom + (hTo - hFrom)*e;
  clearCol.copy(bgFrom).lerp(bgTo, e); renderer.setClearColor(clearCol, 1);
}

/* ---------- Cámara: misma escena, vista isométrica o cenital ---------- */
let p = 0, target = 0, orbit = 0;
const BASE_H = .75, TOP_H = .53, TRANS = .75;
const isoDir = new V3(Math.sin(Math.PI/4)*Math.cos(.6155), Math.sin(.6155), Math.cos(Math.PI/4)*Math.cos(.6155));
const upA = new V3(0,1,0), upB = new V3(0,0,-1), camT = new V3();
function resize(){
  const w = stage.clientWidth || 300;
  renderer.setSize(w, w, false);
  const H = S*BASE_H;
  cam.left = -H; cam.right = H; cam.top = H; cam.bottom = -H;
  cam.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);

function placeCamera(e){
  const D = S*3;
  const tIso = new V3(0, S*.05, 0);
  camT.copy(tIso).lerp(new V3(0,0,0), e);
  cam.position.copy(isoDir).multiplyScalar(D).add(tIso).lerp(new V3(0, D, 0), e);
  cam.up.copy(upA).lerp(upB, e).normalize();
  cam.lookAt(camT);
  cam.zoom = 1 + (BASE_H/TOP_H - 1)*e;
  cam.updateProjectionMatrix();
}
const wrap = a => { a = (a + Math.PI) % (Math.PI*2); if (a < 0) a += Math.PI*2; return a - Math.PI; };

function toggleView(){
  target = target ? 0 : 1;
  if (target) orbit = wrap(orbit);
  $('#chip').textContent = target ? 'Toca para ver el árbol' : 'Toca el árbol para ver el código QR';
}
stage.addEventListener('click', toggleView);
stage.addEventListener('keydown', e => { if (e.key === 'Enter') toggleView(); });
addEventListener('keydown', e => {
  const tag = document.activeElement?.tagName;
  if (e.code === 'Space' && tag !== 'INPUT' && tag !== 'BUTTON'){ e.preventDefault(); toggleView(); }
});

/* ---------- Partículas ---------- */
let spawnT = 0;
function groundAt(x, z){
  const c = Math.floor(x + half), r = Math.floor(z + half);
  if (c < 0 || r < 0 || c >= S || r >= S) return -999;
  return heights[r*S + c];
}
const tmpC = new THREE.Color();
function spawnLeaf(P){
  const slot = falls.findIndex(f => !f.alive);
  if (slot < 0 || !leafPos.length) return;
  const lp = leafPos[Math.random()*leafPos.length | 0], k = S/35;
  const f = { alive:true, state:0, x:lp.x, y:lp.y - .3, z:lp.z, vy:-rr(1.1,2.1)*P.fall.speed*k,
    ph:Math.random()*6.28, rx:Math.random()*6.28, ry:Math.random()*6.28, rz:Math.random()*6.28,
    sx:rr(-3,3), sy:rr(-3,3), sz:rr(-2,2), s:rr(.8,1.15)*P.fall.scale, timer:0 };
  f.base = f.s; falls[slot] = f;
  tmpC.set(P.fall.colors[Math.random()*P.fall.colors.length | 0]);
  fallMesh.setColorAt(slot, tmpC); fallMesh.instanceColor.needsUpdate = true;
}
function updateFalls(dt, t, vis){
  const P = SEASONS[season];
  let alive = 0; for (const f of falls) if (f.alive) alive++;
  spawnT += dt;
  if (vis > .7 && spawnT > P.fall.every && alive < P.fall.max){ spawnT = 0; spawnLeaf(P); }
  falls.forEach((f, i) => {
    if (f.alive){
      if (f.state === 0){
        f.y += f.vy*dt;
        f.x += (Math.sin(t*1.3 + f.ph)*.9 + .35)*dt;
        f.z += Math.cos(t*1.1 + f.ph)*.5*dt;
        f.rx += f.sx*dt; f.ry += f.sy*dt; f.rz += f.sz*dt;
        const gy = groundAt(f.x, f.z);
        if (gy > -1 && f.y <= gy + .04){ f.y = gy + .04; f.state = 1; f.timer = rr(3,6); f.rx = -Math.PI/2; f.ry = 0; }
        if (f.y < -6) f.alive = false;
      } else {
        f.timer -= dt;
        if (f.timer < .6) f.s = f.base*Math.max(0, f.timer/.6);
        if (f.timer <= 0) f.alive = false;
      }
    }
    const s = f.alive ? f.s*vis : 0;
    tmpE.set(f.rx || 0, f.ry || 0, f.rz || 0, 'XYZ'); tmpQ.setFromEuler(tmpE); tmpS.set(s, s, s); tmpP.set(f.x || 0, f.y || 0, f.z || 0);
    tmpM.compose(tmpP, tmpQ, tmpS); fallMesh.setMatrixAt(i, tmpM);
  });
  fallMesh.instanceMatrix.needsUpdate = true;
}
function levelTo(sys, goal, dt){ sys.level += (goal - sys.level)*Math.min(1, dt*3); return sys.level; }
function updateRain(dt, vis){
  const L = levelTo(rain, SEASONS[season].rain*vis, dt);
  rain.obj.visible = L > .01; rain.obj.material.opacity = .32*L;
  if (!rain.obj.visible) return;
  const a = rain.obj.geometry.attributes.position.array;
  rain.d.forEach((d, i) => {
    d.y -= d.v*dt;
    if (d.y < Math.max(.6, groundAt(d.x, d.z))){ d.y = S*.75 + Math.random()*6; d.x = rr(-half,half); d.z = rr(-half,half); }
    a[i*6] = d.x; a[i*6+1] = d.y; a[i*6+2] = d.z; a[i*6+3] = d.x + .12; a[i*6+4] = d.y + 1.5; a[i*6+5] = d.z;
  });
  rain.obj.geometry.attributes.position.needsUpdate = true;
}
function updateSnow(dt, t, vis){
  const L = levelTo(snow, SEASONS[season].snow*vis, dt);
  snow.obj.visible = L > .01; snow.obj.material.opacity = L;
  if (!snow.obj.visible) return;
  const a = snow.obj.geometry.attributes.position.array;
  snow.d.forEach((d, i) => {
    d.y -= (1.1 + d.ph*.9)*dt*(S/35);
    d.x += (Math.sin(t*.8 + d.ph*9)*.5 + .15)*dt;
    d.z += Math.cos(t*.6 + d.ph*7)*.3*dt;
    if (d.y < Math.max(.5, groundAt(d.x, d.z))){ d.y = S*.75 + Math.random()*4; d.x = rr(-half,half); d.z = rr(-half,half); }
    a[i*3] = d.x; a[i*3+1] = d.y; a[i*3+2] = d.z;
  });
  snow.obj.geometry.attributes.position.needsUpdate = true;
}
function updateMotes(dt, t, vis){
  const L = levelTo(motes, SEASONS[season].motes*vis, dt);
  motes.obj.visible = L > .01; motes.obj.material.opacity = L*(.75 + .25*Math.sin(t*2.2));
  if (!motes.obj.visible) return;
  const a = motes.obj.geometry.attributes.position.array;
  motes.d.forEach((d, i) => {
    d.y += .5*dt*(S/35);
    if (d.y > S*.68){ d.y = 1; d.x = rr(-S*.36,S*.36); d.z = rr(-S*.36,S*.36); }
    a[i*3] = d.x + Math.sin(t*.9 + d.ph)*.8; a[i*3+1] = d.y; a[i*3+2] = d.z + Math.cos(t*.7 + d.ph)*.8;
  });
  motes.obj.geometry.attributes.position.needsUpdate = true;
}

/* ---------- Bucle ---------- */
let last = performance.now();
let recording = false;
function frame(now){
  const dt = Math.min(.05, (now - last)/1000); last = now;
  if (!recording){
    p += (target ? 1 : -1)*dt/TRANS; p = clamp01(p);
    if (!target && !reduce) orbit += dt*.05;
    step(dt, now/1000);
  }
  requestAnimationFrame(frame);
}
function step(dt, t){
  uTime.value = t;
  const e = ease(p);
  world.rotation.y = wrap(orbit)*(1 - e);
  placeCamera(e);

  const vis = 1 - e;
  // En la vista cenital las ramas se afinan y el viento se calma para que el código quede nítido
  uBranch.value = .08 + .92*vis;
  uFlutter.value = .15 + .85*vis;
  leaves.castShadow = branchMesh.castShadow = grass.castShadow = vis > .35;
  treeGroup.rotation.z = Math.sin(t*.8)*.01*vis; treeGroup.rotation.x = Math.cos(t*.6)*.008*vis;

  if (blend < 1){ blend = Math.min(1, blend + dt/.9); applyBlend(blend); }

  updateFalls(dt, t, vis);
  updateRain(dt, vis);
  updateSnow(dt, t, vis);
  updateMotes(dt, t, vis);
  audioTick(t, vis);

  renderer.render(scene, cam);
}

/* ---------- QR ---------- */
if (qrcode.stringToBytesFuncs && qrcode.stringToBytesFuncs['UTF-8']) qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];
function makeQR(text){
  const q = qrcode(0, 'Q'); q.addData(text); q.make();
  const n = q.getModuleCount(), m = [];
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) m.push(q.isDark(r, c));
  return { n, m };
}
let lastText = '';
function regenerate(){
  const text = $('#url').value.trim();
  if (!text || text === lastText) return;
  try { const qr = makeQR(text); lastText = text; $('#err').hidden = true; buildWorld(qr); }
  catch(err){ $('#err').hidden = false; }
}
let deb;
$('#url').addEventListener('input', () => { clearTimeout(deb); deb = setTimeout(regenerate, 450); });
$('#url').addEventListener('keydown', e => { if (e.key === 'Enter'){ clearTimeout(deb); regenerate(); e.target.blur(); } });
document.querySelectorAll('.season[data-s]').forEach(b => b.addEventListener('click', () => { if (b.dataset.s !== season) setSeason(b.dataset.s, false); }));

/* ---------- Guardar PNG ---------- */
let dlCache = null;
async function getDownloads(){
  // window.claude puede llegar después de cargar la página: no se guarda un "no disponible"
  if (dlCache) return dlCache;
  if (!(window.claude && window.claude.use)) return null;
  try { dlCache = await window.claude.use('downloads'); } catch(_){ dlCache = null; }
  return dlCache;
}
function renderSource(){
  if (target && p > .99){
    // QR plano en alta resolución con los colores que se ven desde arriba
    const px = Math.ceil(1200/S), cv = document.createElement('canvas');
    cv.width = cv.height = px*S;
    const g = cv.getContext('2d'), P = SEASONS[season], c = new THREE.Color();
    cells.forEach((cl, i) => {
      if (cl.kind === 'leaf') c.set(P.leaves[Math.floor(cl.k*P.leaves.length)]);
      else if (cl.kind === 'grass') c.set(P.grass[Math.floor(cl.k*P.grass.length)]);
      else c.set(P.light[Math.floor(cl.k*P.light.length)]);
      g.fillStyle = '#' + c.getHexString();
      g.fillRect((i % S)*px, Math.floor(i/S)*px, px + .5, px + .5);
    });
    return cv;
  }
  // Escena a 1600 px, sin importar el tamaño de la pantalla
  const pr = renderer.getPixelRatio();
  renderer.setPixelRatio(1); renderer.setSize(1600, 1600, false);
  renderer.render(scene, cam);
  const cv = document.createElement('canvas');
  cv.width = cv.height = 1600;
  const g = cv.getContext('2d');
  g.fillStyle = '#' + clearCol.getHexString(); g.fillRect(0, 0, 1600, 1600);
  g.drawImage(renderer.domElement, 0, 0);
  renderer.setPixelRatio(pr); resize();
  return cv;
}
function showPreview(src, text){
  const pv = $('#shot'); pv.width = src.width; pv.height = src.height;
  pv.getContext('2d').drawImage(src, 0, 0);
  $('#msg').textContent = text;
  $('#overlay').hidden = false;
}
async function deliver(blob, name, previewSrc){
  const kind = name.endsWith('.gif') ? 'el GIF' : name.endsWith('.png') ? 'el PNG' : 'el video';
  if (!window.claude){
    // Archivo abierto directo en el navegador: descarga normal
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 8000);
    return;
  }
  const dl = await getDownloads();
  let why = 'La descarga no está disponible en esta vista.';
  if (dl){
    try { await dl.save({ filename:name, data:blob }); return; }
    catch(err){
      if (err && (err.code === 'declined' || err.code === 'rate_limited')) return;
      why = 'No se pudo guardar desde aquí (' + (err && err.code || 'error') + ').';
    }
  }
  const msg = why + ' Abre el archivo HTML en Safari o en la computadora para descargar ' + kind + '.';
  if (previewSrc) showPreview(previewSrc, msg);
  else { $('#chip').textContent = msg; }
}
async function exportPNG(){
  const btn = $('#save'); btn.disabled = true;
  try {
    const src = renderSource();
    const name = (target ? 'arbol-qr-codigo-' : 'arbol-qr-escena-') + season + '.png';
    const blob = await new Promise(res => src.toBlob(res, 'image/png'));
    if (blob) await deliver(blob, name, src);
  } finally { btn.disabled = false; }
}
$('#save').addEventListener('click', exportPNG);
$('#close').addEventListener('click', () => { $('#overlay').hidden = true; });
$('#overlay').addEventListener('click', e => { if (e.target.id === 'overlay') $('#overlay').hidden = true; });

/* ---------- Exportar GIF: árbol → QR → árbol, en bucle ---------- */
async function exportGIF(){
  const G = window.GIFENC;
  if (!G || !G.GIFEncoder){ $('#chip').textContent = 'No se pudo cargar el generador de GIF'; return; }
  const btns = [$('#gif'), $('#save'), $('#vid')]; btns.forEach(b => b.disabled = true);
  const chip = $('#chip'), chipText = chip.textContent;
  const SIZE = 420, FPS = 15, DUR = 6.4;
  // Guion del GIF en segundos: árbol, sube a QR, se queda, vuelve al árbol
  const sched = tt => tt < 1.8 ? 0 : tt < 2.6 ? (tt - 1.8)/.8 : tt < 4.4 ? 1 : tt < 5.2 ? 1 - (tt - 4.4)/.8 : 0;
  const saved = { p, target, pr:renderer.getPixelRatio() };
  recording = true;
  renderer.setPixelRatio(1); renderer.setSize(SIZE, SIZE, false);
  const grab = document.createElement('canvas'); grab.width = grab.height = SIZE;
  const gctx = grab.getContext('2d', { willReadFrequently:true });
  const read = () => { gctx.drawImage(renderer.domElement, 0, 0); return gctx.getImageData(0, 0, SIZE, SIZE).data; };
  try {
    let t0 = performance.now()/1000;
    // Paleta común a partir de varios cuadros, para que los colores no parpadeen
    const samples = [];
    for (const pp of [0, .5, 1]){ p = pp; step(1/FPS, t0); samples.push(read()); }
    const all = new Uint8ClampedArray(samples.reduce((n, a) => n + a.length, 0));
    let off = 0; samples.forEach(a => { all.set(a, off); off += a.length; });
    const palette = G.quantize(all, 256, { format:'rgb565' });
    const enc = G.GIFEncoder();
    const total = Math.round(DUR*FPS);
    for (let i = 0; i < total; i++){
      const tt = i/FPS;
      p = clamp01(sched(tt));
      step(1/FPS, t0 + tt);
      const idx = G.applyPalette(read(), palette, 'rgb565');
      enc.writeFrame(idx, SIZE, SIZE, i === 0 ? { palette, delay:Math.round(1000/FPS), repeat:0 } : { delay:Math.round(1000/FPS) });
      if (i % 4 === 0){ chip.textContent = 'Generando GIF… ' + Math.round(i/total*100) + ' %'; await new Promise(r => setTimeout(r, 0)); }
    }
    enc.finish();
    const blob = new Blob([enc.bytes()], { type:'image/gif' });
    chip.textContent = chipText;
    await deliver(blob, 'arbol-qr-' + season + '.gif', null);
  } catch(err){
    chip.textContent = 'No se pudo generar el GIF';
  } finally {
    p = saved.p; target = saved.target;
    renderer.setPixelRatio(saved.pr); resize();
    recording = false; last = performance.now();
    btns.forEach(b => b.disabled = false);
    setTimeout(() => { if (chip.textContent.startsWith('No se pudo')) chip.textContent = target ? 'Toca para ver el árbol' : 'Toca el árbol para ver el código QR'; }, 3500);
  }
}
$('#gif').addEventListener('click', exportGIF);

/* ---------- Exportar video vertical 9:16 para Reels/TikTok ---------- */
async function exportVideo(){
  const chip = $('#chip'), chipText = chip.textContent;
  const probe = document.createElement('canvas');
  if (!window.MediaRecorder || !probe.captureStream){ chip.textContent = 'Este navegador no puede grabar video'; return; }
  const types = ['video/mp4;codecs=avc1.42E01F','video/mp4','video/webm;codecs=vp9','video/webm'];

  const saved = { p, target, pr:renderer.getPixelRatio() };

  const paint = () => {
    o.fillStyle = '#' + clearCol.getHexString(); o.fillRect(0, 0, W, H);
    o.drawImage(renderer.domElement, 0, (H - SZ)/2 - 80);
  };
  try {
    p = 0; step(1/30, performance.now()/1000); paint();
    rec.start(250);
    const start = performance.now(); let prev = start;
    await new Promise(done => {
      const tick = now => {
        const tt = (now - start)/1000, dt = Math.min(.05, (now - prev)/1000); prev = now;
        p = clamp01(sched(tt));
        step(dt, now/1000); paint();
        chip.textContent = 'Grabando video… ' + Math.min(100, Math.round(tt/DUR*100)) + ' %';
        if (tt >= DUR) done(); else requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    });
    rec.stop(); await stopped;
    chip.textContent = chipText;
    const blob = new Blob(chunks, { type:mime.split(';')[0] });
    await deliver(blob, 'arbol-qr-' + season + '.' + ext, null);
  } catch(err){
    chip.textContent = 'No se pudo grabar el video';
    try { if (rec.state !== 'inactive') rec.stop(); } catch(_){}
  } finally {
    if (audioDest) try { master.disconnect(audioDest); } catch(_){}
    out.remove();
    p = saved.p; target = saved.target;
    renderer.setPixelRatio(saved.pr); resize();
    recording = false; last = performance.now();
    btns.forEach(b => b.disabled = false);
    setTimeout(() => { if (chip.textContent.startsWith('No se pudo') || chip.textContent.startsWith('Este navegador')) chip.textContent = target ? 'Toca para ver el árbol' : 'Toca el árbol para ver el código QR'; }, 3500);
  }
}
$('#vid').addEventListener('click', exportVideo);

/* ---------- Sonido ambiente ---------- */
let actx = null, master, windG, rainG, windF, muted = true, nextBird = 0, audioVis = 1;
function noiseBuffer(brown){
  const len = actx.sampleRate*4, buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
  let lastV = 0;
  for (let i = 0; i < len; i++){
    const w = Math.random()*2 - 1;
    if (brown){ lastV = (lastV + .02*w)/1.02; d[i] = lastV*3.5; } else d[i] = w*.5;
  }
  return buf;
}
function initAudio(){
  actx = new (window.AudioContext || window.webkitAudioContext)();
  master = actx.createGain(); master.gain.value = 0; master.connect(actx.destination);
  const ws = actx.createBufferSource(); ws.buffer = noiseBuffer(true); ws.loop = true;
  windF = actx.createBiquadFilter(); windF.type = 'lowpass'; windF.frequency.value = 500;
  windG = actx.createGain(); windG.gain.value = 0;
  ws.connect(windF).connect(windG).connect(master); ws.start();
  const rs = actx.createBufferSource(); rs.buffer = noiseBuffer(false); rs.loop = true;
  const rf = actx.createBiquadFilter(); rf.type = 'bandpass'; rf.frequency.value = 1400; rf.Q.value = .5;
  rainG = actx.createGain(); rainG.gain.value = 0;
  rs.connect(rf).connect(rainG).connect(master); rs.start();
}
function audioSeason(){
  if (!actx) return;
  const A = SEASONS[season].audio, now = actx.currentTime;
  windG.gain.setTargetAtTime(A.wind, now, .6);
  rainG.gain.setTargetAtTime(A.rain, now, .6);
}
function chirp(){
  const now = actx.currentTime, notes = 2 + (Math.random()*3 | 0), base = rr(2300, 3200);
  for (let i = 0; i < notes; i++){
    const o = actx.createOscillator(), g = actx.createGain(), st = now + i*.13;
    o.type = 'sine'; o.frequency.setValueAtTime(base, st); o.frequency.exponentialRampToValueAtTime(base*rr(1.15,1.45), st + .08);
    g.gain.setValueAtTime(0, st); g.gain.linearRampToValueAtTime(.035, st + .015); g.gain.exponentialRampToValueAtTime(.0001, st + .11);
    o.connect(g).connect(master); o.start(st); o.stop(st + .13);
  }
}
function audioTick(t, vis){
  if (!actx || muted) return;
  if (Math.abs(vis - audioVis) > .02){ audioVis = vis; master.gain.setTargetAtTime(.35 + .65*vis, actx.currentTime, .3); }
  windF.frequency.value = 380 + 220*(.5 + .5*Math.sin(t*.25));
  if (SEASONS[season].audio.birds && vis > .7 && t > nextBird){ nextBird = t + rr(2, 5.5); if (Math.random() < .7) chirp(); }
}
$('#mute').addEventListener('click', () => {
  if (!actx) initAudio();
  if (actx.state === 'suspended') actx.resume();
  muted = !muted;
  master.gain.setTargetAtTime(muted ? 0 : .35 + .65*(1 - ease(p)), actx.currentTime, .3);
  audioVis = -1;
  audioSeason();
  $('#mute').setAttribute('aria-pressed', !muted);
  $('#mute').setAttribute('aria-label', muted ? 'Activar sonido' : 'Silenciar');
  $('#ico-off').hidden = !muted; $('#ico-on').hidden = muted;
});

regenerate();
requestAnimationFrame(frame);
})();
